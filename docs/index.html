<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChromeOS Device Information Panel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-main">
      <section class="panel" aria-label="Device attributes">
        <div class="panel-head">
          <h2>Attribute Summary</h2>
          <span id="status" class="meta">Awaiting wrapper values.</span>
        </div>
        <div class="summary-grid">
          <article class="summary-item">
            <div class="label">Asset ID</div>
            <p id="assetId" class="value">--</p>
          </article>

          <article class="summary-item">
            <div class="label">Serial Number</div>
            <p id="serialNumber" class="value">--</p>
          </article>

          <article class="summary-item">
            <div class="label">Annotated Location</div>
            <p id="annotatedLocation" class="value">--</p>
          </article>

          <article class="summary-item">
            <div class="label">Directory Device ID</div>
            <p id="directoryDeviceId" class="value">--</p>
          </article>
        </div>
      </section>

      <section class="panel" aria-label="Runtime details">
        <div class="panel-head">
          <h2>Device and Runtime Details</h2>
        </div>
        <div class="details-grid">
          <div class="detail-row">
            <span class="detail-label">Platform</span>
            <span id="platform" class="detail-value">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Language</span>
            <span id="language" class="detail-value">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Timezone</span>
            <span id="timezone" class="detail-value">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Viewport</span>
            <span id="viewport" class="detail-value">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Network</span>
            <span id="onlineStatus" class="detail-value">--</span>
          </div>
          <div class="detail-row detail-row-wide">
            <span class="detail-label">User Agent</span>
            <span id="userAgent" class="detail-value detail-mono">--</span>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
